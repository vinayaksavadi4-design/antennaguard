services:
  - type: web
    name: antennaguard-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: antennaguard-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://antennaguard-web.onrender.com,http://localhost:5173,http://localhost:4173

  - type: web
    name: antennaguard-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://antennaguard-api.onrender.com/api

databases:
  - name: antennaguard-db
